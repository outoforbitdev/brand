# Pull request checks. Validates the build but never deploys.
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: extractions/setup-just@v2
      - run: just lint
      - run: just test
      - run: just build-check
