# Builds the brand assets and deploys them to GitHub Pages.
name: Deploy

on:
  push:
    branches: [main]
  # GitHub disables scheduled workflows in public repos after 60 days without
  # repository activity. A push to main counts as activity. The README
  # documents the reminder.
  schedule:
    # Shortly after 00:00 UTC so seasonal windows (UTC dates) flip promptly.
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      variant:
        description: "Optional variant name to force (passed as --variant)"
        required: false
        type: string

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build (check mode)
        env:
          # Passed via env to avoid script injection from the dispatch input.
          VARIANT: ${{ inputs.variant }}
        run: |
          if [ -n "$VARIANT" ]; then
            node scripts/build.js --check --variant "$VARIANT"
          else
            node scripts/build.js --check
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Only deploy from main; other refs (manual dispatch) just validate the build.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
